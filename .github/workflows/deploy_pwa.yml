name: Build & Deploy DemBase PWA

on:
  push:
    branches:
      - feat/auth-redesign
      - main
    paths:
      - 'dembase_flet/**'
      - '.github/workflows/deploy_pwa.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r dembase_flet/requirements.txt

      - name: Executar Testes Automatizados (Flet 1.0.1)
        run: |
          cd dembase_flet
          python test_navegacao_relatorios.py
          python test_custom_date_picker.py

      - name: Compilar PWA Estático (Flet Publish + WASM)
        run: |
          python dembase_flet/build_pwa.py

      - name: Deploy para Cloudflare Pages
        uses: cloudflare/pages-action@v1
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'dembase'
          directory: 'dist'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
